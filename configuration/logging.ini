[loggers]
keys=root

[handlers]
keys=console_handler,file_handler

[formatters]
keys=formatter

[formatter_formatter]
format=%(asctime)s %(name)-8s %(levelname)-8s %(message)s

[logger_root]
level=DEBUG
handlers=console_handler,file_handler

[handler_console_handler]
class=StreamHandler
level=DEBUG
formatter=formatter
args=(sys.stdout,)

[handler_file_handler]
class=FileHandler
level=DEBUG
formatter=formatter
args=('logs/%(date)s_%(command)s.log', 'w')
